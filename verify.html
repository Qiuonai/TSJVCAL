<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Verification — S Javed & Co</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="wrap-outer">
  <div class="sheet" id="sheet">
    <div class="state-msg" id="loadingMsg">
      <div class="t">Looking up report…</div>
      <div class="d">Checking enrolment number against our records.</div>
    </div>
  </div>
</div>

<script>
const LOGO_SVG = `<img src="/logo.png" alt="S Javed & Co." class="brand-logo">`;

function fmt(n){
  return Number(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function renderNotFound(ref){
  document.getElementById('sheet').innerHTML = `
    <div class="letterhead">
      <div class="brand">${LOGO_SVG}<div><div class="name">S Javed &amp; Co.</div><div class="role">Chartered Accountants</div></div></div>
    </div>
    <div class="vstrip bad">
      <div class="left">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9.5" stroke="#B23B3B" stroke-width="1.8"/><path d="M9 9l6 6M15 9l-6 6" stroke="#B23B3B" stroke-width="1.8" stroke-linecap="round"/></svg>
        <div><div class="t">No matching report found</div><div class="s">This enrolment number is not in our records</div></div>
      </div>
      <div class="ref">${ref || '—'}</div>
    </div>
    <div class="state-msg">
      <div class="t">We couldn't verify this enrolment number</div>
      <div class="d">Double-check the number printed on the report, or contact our office directly if you believe this is an error.</div>
    </div>
  `;
}

function renderReport(r){
  document.getElementById('sheet').innerHTML = `
    <div class="letterhead">
      <div class="brand">${LOGO_SVG}<div><div class="name">S Javed &amp; Co.</div><div class="role">Chartered Accountants</div></div></div>
      <div class="ca">CA Enrolment No. ${r.caEnrolmentNo}<br>sjavedverification.com</div>
    </div>

    <div class="vstrip ok">
      <div class="left">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9.5" stroke="#1F8A5C" stroke-width="1.8"/><path d="M8 12.5l2.5 2.5L16.5 9" stroke="#1F8A5C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div><div class="t">This report is genuine</div><div class="s">Matches our records, unaltered since issue</div></div>
      </div>
      <div class="ref">${r.referenceNumber}</div>
    </div>

    <div class="subject">
      <div class="kicker">${r.reportTitle}</div>
      <h1>${r.subjectName}</h1>
      <p class="purpose">${r.purpose}</p>
      <div class="meta-grid">
        <div class="meta-item"><div class="k">Report date</div><div class="v">${r.reportDate}</div></div>
        <div class="meta-item"><div class="k">Enrolment no.</div><div class="v">${r.caEnrolmentNo}</div></div>
        <div class="meta-item"><div class="k">Prepared for</div><div class="v">${r.preparedFor}</div></div>
        <div class="meta-item"><div class="k">Exchange rate used</div><div class="v">${r.exchangeRate}</div></div>
      </div>
    </div>

    <div class="ledger">
      <div class="ledger-title">Summary</div>
      <table class="led">
        <thead><tr><th>Particulars</th><th class="num">BDT</th><th class="num">EUR</th></tr></thead>
        <tbody>
          <tr class="total"><td>Total assets</td><td class="num">${fmt(r.totalAssetsBDT)}</td><td class="num">${fmt(r.totalAssetsEUR)}</td></tr>
          <tr class="total"><td>Total annual income</td><td class="num">${fmt(r.totalIncomeBDT)}</td><td class="num">${fmt(r.totalIncomeEUR)}</td></tr>
        </tbody>
      </table>
      <p class="privacy-note">Detailed breakdown of individual assets and income sources is withheld from this page for client privacy.</p>

      <div class="stamp-wrap">
        <svg class="stamp" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
          <circle cx="60" cy="60" r="52" fill="none" stroke="#1F8A5C" stroke-width="2" stroke-dasharray="3 3.2"/>
          <circle cx="60" cy="60" r="43" fill="none" stroke="#1F8A5C" stroke-width="1.2"/>
          <path id="arcTop" d="M 22 60 A 38 38 0 0 1 98 60" fill="none"/>
          <text font-family="Inter, sans-serif" font-size="9.5" font-weight="700" letter-spacing="2" fill="#1F8A5C">
            <textPath href="#arcTop" startOffset="50%" text-anchor="middle">VERIFIED &amp; GENUINE</textPath>
          </text>
          <polygon points="60,74 60,90 78,100" fill="#2E6FDB" transform="translate(-9,-38) scale(0.62)"/>
          <polygon points="60,74 60,90 42,90" fill="#0A1440" transform="translate(-9,-38) scale(0.62)"/>
          <polygon points="42,90 60,90 78,100" fill="#9AA3AE" transform="translate(-9,-38) scale(0.62)"/>
          <text x="60" y="86" font-family="'JetBrains Mono', monospace" font-size="7" fill="#1F8A5C" text-anchor="middle">${r.reportDate}</text>
        </svg>
      </div>
    </div>

    <div class="signoff">
      <div class="fw">S Javed &amp; Co.</div>
      <div class="role2">Chartered Accountants · Place: Dhaka, Bangladesh</div>
    </div>

    <div class="foot">
      <p>Scanned from a QR code on a report issued by S Javed &amp; Co.<br>
      Questions about this report? <a href="mailto:${r.contactEmail}">Contact our office</a></p>
    </div>
  `;
}

(function init(){
  const params = new URLSearchParams(window.location.search);
  const ref = params.get('ref');
  if(!ref){ renderNotFound(''); return; }

  fetch('/api/verify/' + encodeURIComponent(ref))
    .then(res => {
      if(!res.ok) throw new Error('not found');
      return res.json();
    })
    .then(renderReport)
    .catch(() => renderNotFound(ref));
})();
</script>

</body>
</html>
