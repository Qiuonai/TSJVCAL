<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S Javed & Co — Report Verification</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="site-header">
  <svg viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
    <polygon points="50,2 50,50 95,88" fill="#2E6FDB"/>
    <polygon points="50,2 50,50 5,50" fill="#0A1440"/>
    <polygon points="5,50 50,50 95,88" fill="url(#steelGrad)"/>
    <defs><linearGradient id="steelGrad" x1="5" y1="50" x2="95" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9AA3AE"/><stop offset="1" stop-color="#EDEFF1"/>
    </linearGradient></defs>
  </svg>
  <div>
    <div class="name">S Javed &amp; Co.</div>
    <div class="role">Chartered Accountants</div>
  </div>
</div>

<div class="home-wrap">
  <svg class="home-icon" viewBox="0 0 24 24" fill="none">
    <circle cx="12" cy="12" r="9.5" stroke="#1F8A5C" stroke-width="1.6"/>
    <path d="M8 12.5l2.5 2.5L16.5 9" stroke="#1F8A5C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="lede">Verify a report</div>
  <p class="sub">Scan the QR code printed on your S Javed &amp; Co. report, or enter its reference number below to confirm it's genuine and unaltered.</p>

  <form class="search-box" id="searchForm">
    <input type="text" id="refInput" placeholder="e.g. SJC-VAL-2026-1644" autocomplete="off" spellcheck="false">
    <button type="submit">Verify</button>
  </form>
  <div class="home-note">Reference number is printed at the top of every report we issue.</div>
</div>

<script>
  document.getElementById('searchForm').addEventListener('submit', function(e){
    e.preventDefault();
    var ref = document.getElementById('refInput').value.trim();
    if(!ref) return;
    window.location.href = '/verify.html?ref=' + encodeURIComponent(ref);
  });
</script>

</body>
</html>
